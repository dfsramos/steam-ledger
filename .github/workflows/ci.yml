name: CI

# Fast correctness check on every push/PR — separate from release.yml
# (Windows-only installer builds). Runs on ubuntu-latest since this only
# exercises cross-platform logic (parsing, reconciliation, currency math,
# etc.), not the Windows packaging step.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Compiling this crate at all — even just for `cargo test` — pulls in
      # Tauri's GTK/WebKitGTK Linux bindings, which need these system dev
      # packages present at build time. ubuntu-latest doesn't have them by
      # default (confirmed live: the first run of this workflow failed on
      # `glib-2.0`/`gobject-2.0`/`gio-2.0` not found via pkg-config).
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
